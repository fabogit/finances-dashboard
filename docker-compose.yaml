services:
  # --- Backend Core (NestJS) ---
  backend-core:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    container_name: finance-backend-core
    ports:
      - "3000:3000"
    volumes:
      # Mount local code into the container for hot-reload
      - ./backend-core:/app
      # Prevent local node_modules from overwriting the container's node_modules
      - /app/node_modules
      # Database Persistence: Mapping a local data folder
      - ./data:/app/data
    environment:
      # Define DB location (this path will be used in Prisma)
      - DATABASE_URL=file:/app/data/finance.db
      - SCIENCE_SERVICE_URL=http://backend-science:8000
    networks:
      - finance-network
    depends_on:
      - backend-science

  # --- 2: PYTHON (Science) ---
  backend-science:
    build:
      context: ./backend-science
      dockerfile: Dockerfile
    container_name: finance-backend-science
    ports:
      - "8000:8000"
    volumes:
      - ./backend-science:/app
      - /app/__pycache__
      - /app/.venv
    networks:
      - finance-network

networks:
  finance-network:
    driver: bridge
