services:
  # --- 1. DATABASE (Postgres) ---
  postgres:
    container_name: fn-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fn-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 2. Backend Core (NestJS) ---
  backend-core:
    container_name: fn-core
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SERVER_PORT}:3000"
    volumes:
      - ./backend-core:/app
      - backend_core_modules:/app/node_modules
      - backend_core_dist:/app/dist
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SCIENCE_SERVICE_URL=${SCIENCE_SERVICE_URL}
    networks:
      - fn-network
    depends_on:
      postgres:
        condition: service_healthy
      backend-science:
        condition: service_started

  # --- 3: PYTHON (Science) ---
  backend-science:
    container_name: fn-science
    build:
      context: ./backend-science
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SCIENCE_PORT}:8000"
    volumes:
      - ./backend-science:/app
      - backend-science-cache:/app/__pycache__
    networks:
      - fn-network

networks:
  fn-network:
    name: fn-network
    driver: bridge

volumes:
  postgres_data:
  backend_core_modules:
  backend_core_dist:
  backend-science-cache: