name: Backend CI

on:
  workflow_dispatch:

  push:
    branches: ["main", "develop"]
    paths:
      - "backend-core/**"
      - "backend-science/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "backend-core/**"
      - "backend-science/**"
      - ".github/workflows/**"

jobs:
  # --- JOB 0: DETECT CHANGES ---
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      science: ${{ steps.filter.outputs.science }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'backend-core/**'
            science:
              - 'backend-science/**'

  # --- JOB 1: CORE QUALITY CHECK (Linting & Formatting) ---
  core-quality:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run Linter
        run: pnpm run lint

      - name: Check Formatting
        run: pnpm run format

  # --- JOB 2: CORE UNIT TESTS ---
  core-unit-tests:
    needs: [changes, core-quality]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run Unit Tests
        run: pnpm test

  # --- JOB 3: SCIENCE QUALITY (Python Linting) ---
  science-quality:
    needs: changes
    if: needs.changes.outputs.science == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-science

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyright

      - name: Run Type Check (Pyright)
        run: pyright .

      - name: Run Unit Tests (Pytest)
        run: python -m pytest tests/

      - name: Verify Requirements Syntax
        run: pip install -r requirements.txt --dry-run

  # --- JOB 4: SCIENCE BUILD (Docker Verification) ---
  science-build:
    needs: [changes, science-quality]
    if: needs.changes.outputs.science == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-science

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./backend-science
          push: false
          tags: science-service:test

  # --- JOB 5: CORE E2E TESTS (With Postgres Service) ---
  core-e2e-tests:
    needs: [changes, core-quality]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-core

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: finance_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run Migrations
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/finance_test_db?schema=public

      - name: Run E2E Tests
        run: pnpm run test:e2e
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/finance_test_db?schema=public
          JWT_SECRET: "secret-for-testing-only"
          PORT: 3000
          HOST: 0.0.0.0
          SCIENCE_SERVICE_URL: "http://localhost:8000"
          CORS_ORIGIN: "*"
