name: Backend CI

on:
  workflow_dispatch:
  
  push:
    branches: ["main", "develop"]
    paths:
      - "backend-core/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "backend-core/**"
      - ".github/workflows/**"

jobs:
  # --- JOB 1: QUALITY CHECK (Linting & Formatting) ---
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm run lint

      - name: Check Formatting
        run: pnpm run format

  # --- JOB 2: UNIT TESTS ---
  unit-tests:
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: pnpm test

  # --- JOB 3: E2E TESTS (With Postgres Service) ---
  e2e-tests:
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-core

    # GitHub Actions Service Container (CI "Docker Compose")
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: finance_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/finance_test_db?schema=public

      - name: Run E2E Tests
        run: pnpm run test:e2e
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/finance_test_db?schema=public
          JWT_SECRET: "secret-for-testing-only"
          PORT: 3000
          HOST: 0.0.0.0
          SCIENCE_SERVICE_URL: "http://localhost:8000"
          CORS_ORIGIN: "*"
