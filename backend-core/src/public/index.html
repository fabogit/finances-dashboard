<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Finance Dashboard API - Manage and analyze your personal expenses">
    <title>Finance Dashboard API</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            line-height: 1.5;
        }

        .card {
            background: var(--surface);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: background-color 0.2s;
            outline: 2px solid transparent;
            outline-offset: 2px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:focus-visible {
            box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--primary);
        }

        .icon {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <main class="card">
        <div role="img" aria-label="Finance Dashboard Logo" style="font-size: 3rem; margin-bottom: 1rem;">
            📊
        </div>
        <h1>Finance Dashboard API</h1>
        <p>
            Welcome to the backend service for your personal finance manager.
            The system is running and ready to process your transactions.
        </p>

        <a href="/doc" class="btn">
            <span class="icon" aria-hidden="true">📑</span>
            Explore API Documentation
        </a>
    </main>
</body>
</html>
