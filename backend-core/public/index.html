<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Dashboard API</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --text: #1e293b;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      line-height: 1.5;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      max-width: 24rem;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      color: var(--primary);
    }
    p {
      color: #64748b;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="card">
    <span style="font-size: 3rem; margin-bottom: 1rem; display: block;" role="img" aria-label="Chart increasing">📈</span>
    <h1>Finance Dashboard</h1>
    <p>Welcome to the Finance Dashboard API. Use the documentation to explore endpoints and manage your expenses.</p>
    <a href="/doc" class="btn">View API Documentation</a>
  </main>
</body>
</html>
